name: Generate GitHub Breakout

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generate-svg:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Breakout SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          paddle_color: "#FFFFFF"
          ball_color: "#FFFFFF"
          bricks_colors: "#303030,#505050,#707070,#A0A0A0,#FFFFFF"

      - name: Inspect generated files
        run: |
          echo "=== Repository ==="
          ls -la

          echo "=== Output directory ==="
          if [ -d output ]; then
            find output -maxdepth 2 -type f -print
          else
            echo "output/ does not exist"
          fi

          echo "=== All SVG files ==="
          find . -type f -name "*.svg" -print

      - name: Move generated SVG
        run: |
          mkdir -p /tmp/breakout-images

          if [ -f output/custom.svg ]; then
            echo "Found output/custom.svg"
            mv output/custom.svg /tmp/breakout-images/breakout.svg
          elif [ -f output/dark.svg ]; then
            echo "Found output/dark.svg"
            mv output/dark.svg /tmp/breakout-images/breakout-dark.svg
          elif [ -f output/light.svg ]; then
            echo "Found output/light.svg"
            mv output/light.svg /tmp/breakout-images/breakout-light.svg
          else
            echo "Error: No generated Breakout SVG was found."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push Breakout SVG
        run: |
          git checkout --orphan github-breakout
          git rm -rf .
          mkdir images
          mv /tmp/breakout-images/* images/
          git add images
          git commit -m "chore: update GitHub breakout SVG"
          git push --force origin github-breakout
